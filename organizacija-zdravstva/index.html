<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interaktivni testovi i skripta za pripremu ispita iz organizacije zdravstva: sedam lekcija, simulacija ispita na vreme, automatsko bodovanje.">
<title>Testovi iz organizacije zdravstva</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow exam-sheet column; home = exam block + lessons as collapsible sheets, runner = one question per screen, result = score sheet + full review. */
:root{
  --bg:#eaf0f2; --surface:#ffffff; --sunk:#f3f7f8; --ink:#13242d; --muted:#586b76; --line:#cfdbe0;
  --accent:#0b6b78; --accent-ink:#ffffff; --accent-soft:#d9eef1;
  --good:#1b7646; --good-bg:#def3e6; --bad:#b2362b; --bad-bg:#fbe3e0; --warn:#8a5a00; --warn-bg:#fbefd2; --veil:rgba(8,16,20,.55);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171b; --surface:#17232a; --sunk:#121c21; --ink:#e5eef1; --muted:#93a6b0; --line:#2b3c45;
  --accent:#55c4d0; --accent-ink:#06262b; --accent-soft:#143840;
  --good:#63d193; --good-bg:#143524; --bad:#f28b80; --bad-bg:#3e1d1a; --warn:#f0c268; --warn-bg:#3a2e12; --veil:rgba(0,0,0,.65);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171b; --surface:#17232a; --sunk:#121c21; --ink:#e5eef1; --muted:#93a6b0; --line:#2b3c45;
  --accent:#55c4d0; --accent-ink:#06262b; --accent-soft:#143840;
  --good:#63d193; --good-bg:#143524; --bad:#f28b80; --bad-bg:#3e1d1a; --warn:#f0c268; --warn-bg:#3a2e12; --veil:rgba(0,0,0,.65);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:28px 56px}
#app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,p,ul{margin:0}
h1{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.5rem);line-height:1.08;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-size:1.2rem;line-height:1.2;text-wrap:balance}
.eyebrow{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lead{color:var(--muted);max-width:62ch}
.muted{color:var(--muted)} .small{font-size:.9rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 0;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600}
a.btn{display:inline-block;text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{color:var(--accent);font-weight:600;text-decoration:none}
.link:hover{text-decoration:underline}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.quiet{background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.sheet .stat{background:var(--sunk)} #app>.stats .stat{background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--mono);font-size:1.15rem;font-weight:500}
.stat small{color:var(--muted)}
.tests{display:flex;flex-direction:column}
.test{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.test:first-of-type{border-top:0;padding-top:4px}
.test h3{font-size:1.02rem;font-weight:600}
.test .meta{color:var(--muted);font-size:.88rem}
.chip{font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
details.sheet{padding:0}
details.sheet>summary{list-style:none;cursor:pointer;padding:18px 20px;display:flex;gap:14px;align-items:center;border-radius:12px}
details.sheet>summary::-webkit-details-marker{display:none}
details.sheet>summary .num{font-family:var(--mono);color:var(--accent);font-size:1.05rem;flex:none}
details.sheet>summary .caret{flex:none;color:var(--muted);transition:transform .2s}
details.sheet[open]>summary .caret{transform:rotate(90deg)}
details.sheet>.inner{padding:0 20px 16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.help li{margin-bottom:6px;max-width:66ch}
.help ul{padding-left:20px}
/* runner */
.q{font-size:1.18rem;font-weight:500;line-height:1.45;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;width:100%}
.opt b{font-family:var(--mono);font-weight:500;color:var(--muted);flex:none}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-weight:600}
.blank{font:inherit;color:inherit;background:var(--sunk);border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;padding:2px 8px;width:11.5em;max-width:100%;margin:3px 2px}
.fb{border-radius:8px;padding:12px 14px;font-size:.95rem}
.fb.warn{background:var(--warn-bg);color:var(--warn)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb span{color:var(--ink)}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.dot{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-family:var(--mono);font-size:.82rem;text-align:center}
.dot.done{background:var(--accent-soft);border-color:var(--accent-soft)}
.dot.flag{border-color:var(--warn);box-shadow:inset 0 -3px 0 var(--warn)}
.dot.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dot.ok{background:var(--good-bg);border-color:var(--good-bg);color:var(--good)} .dot.no{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad)} .dot.half{background:var(--warn-bg);border-color:var(--warn-bg);color:var(--warn)}
.clock.low{color:var(--bad)}
/* result */
.score{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:center}
.ring{width:132px;height:132px;flex:none}
.big{font-family:var(--display);font-size:2.6rem;line-height:1}
.rev{border-top:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:6px}
.rev:first-of-type{border-top:0}
.rev .ans{font-size:.94rem;color:var(--muted)}
.rev .ans strong{color:var(--ink);font-weight:600}
.copybox{font-family:var(--mono);font-size:.85rem;background:var(--sunk);border-radius:8px;padding:10px 12px;user-select:all;overflow-wrap:anywhere}
.veil{position:fixed;inset:0;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion:reduce){.bar i,details.sheet>summary .caret{transition:none}}
</style>
</head>

<div id="app"></div>

 {t:'tf',q:'Vrsta organizacione strukture ne utiče na komunikaciju i autoritete.',a:false,e:'Utiče na organizacionu šemu, komunikaciju, odnose i autoritete.'},
 {t:'tf',q:'Autoritet, odgovornost, moć i uticaj usko su povezani sa procesom decentralizacije.',a:true}
]}
];
const ORDER=['Organizacija zdravstvene delatnosti: uvod','Komunikacija u delatnosti zdravstvenih radnika','Menadžment i organizacija zdravstvene službe','Organizacija zdravstvene delatnosti','Upravljanje','Osnovni principi organizacije zdravstvene službe','Organizacija zdravstvene delatnosti: ustanove i sestrinski menadžment'];
const NOTE={'Osnovni principi organizacije zdravstvene službe':'video predavanje uz lekciju 1','Organizacija zdravstvene delatnosti: ustanove i sestrinski menadžment':'video predavanje uz lekciju Menadžment','Organizacija zdravstvene delatnosti':'pripravnici, radni odnos, radno vreme, odmori, zarada, sindikat','Upravljanje':'zdravstveno osiguranje, prigovor i žalba, kancelarijsko poslovanje'};
const LESSONS=ORDER.filter(l=>TESTS.some(t=>t.lesson===l)).concat([...new Set(TESTS.map(t=>t.lesson))].filter(l=>!ORDER.includes(l)));
const POOL=TESTS.flatMap(t=>t.qs.map(q=>({...q,src:t.lesson})));

const BASE='';
const TYPE={mc:'Zaokruži tačan odgovor',fill:'Dopuni',tf:'Tačno ili netačno'};
const SHORT={mc:'Zaokruživanje',fill:'Dopuna',tf:'Tačno / netačno'};
const KEY='testovi-zdravstvo-v1',WKEY='testovi-zdravstvo-greske-v1',DAY=24*60*60*1000,PASS=51;
const app=document.getElementById('app');
let view='home',S=null,R=null,onlyWrong=false,confirmEnd=false,confirmReset=false,copied=null,tick=null;
const openL=new Set([0]);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{n=Math.round(n*10)/10;return Number.isInteger(n)?String(n):n.toFixed(1).replace('.',',')};
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','џ':'dz','ш':'s'};
const norm=s=>String(s||'').toLowerCase().replace(/[а-яђјљњћџ]/g,c=>CYR[c]??c).replace(/đ/g,'dj').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function matches(input,alts){const x=norm(input);if(!x)return false;
  return alts.some(a=>{const y=norm(a);if(x===y)return true;const tol=y.length>=10?2:y.length>=5?1:0;return tol>0&&lev(x,y)<=tol})}
/* Ocenjivanje jednog pitanja: vraća poene (0–1) i tačnost svake praznine */
function grade(q,ans){
  if(q.t!=='fill')return{pts:ans===q.a?1:0,ok:[]};
  const a=ans||[],used=new Set(),ok=q.a.map(()=>false);
  q.a.forEach((alts,i)=>{
    if(!q.unordered){ok[i]=matches(a[i],alts);return}
    const j=q.a.findIndex((g,k)=>!used.has(k)&&matches(a[i],g));
    if(j>-1){used.add(j);ok[i]=true}
  });
  return{pts:ok.filter(Boolean).length/ok.length,ok};
}
const answered=(q,a)=>q.t==='fill'?!!(a&&a.some(x=>norm(x))):a!==null&&a!==undefined;
const mark=p=>p<51?5:p<61?6:p<71?7:p<81?8:p<91?9:10;
const correctText=q=>q.t==='mc'?'abcd'[q.a]+') '+q.o[q.a]:q.t==='tf'?(q.a?'Tačno':'Netačno'):q.a.map(g=>g[0]).join('; ');
const givenText=(q,a)=>!answered(q,a)?'bez odgovora':q.t==='mc'?'abcd'[a]+') '+q.o[a]:q.t==='tf'?(a?'Tačno':'Netačno'):a.map(x=>x&&x.trim()?x.trim():'—').join('; ');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- čuvanje: sve važi 24 sata od trenutka kada je zabeleženo ---------- */
function load(){try{const h=JSON.parse(localStorage.getItem(KEY))||{},now=Date.now();let cut=false;
  for(const id of Object.keys(h)){const keep=(h[id]||[]).filter(r=>r.date&&now-r.date<DAY);if(keep.length!==(h[id]||[]).length)cut=true;if(keep.length)h[id]=keep;else delete h[id]}
  if(cut)localStorage.setItem(KEY,JSON.stringify(h));return h}catch(e){return{}}}
function save(id,rec){try{const h=load();(h[id]=h[id]||[]).push(rec);localStorage.setItem(KEY,JSON.stringify(h))}catch(e){}}
function loadWrong(){try{const w=JSON.parse(localStorage.getItem(WKEY))||{},now=Date.now();for(const k of Object.keys(w))if(now-w[k]>=DAY)delete w[k];return w}catch(e){return{}}}
function saveWrong(w){try{localStorage.setItem(WKEY,JSON.stringify(w))}catch(e){}}
function wipe(){try{localStorage.removeItem(KEY);localStorage.removeItem(WKEY)}catch(e){}}

/* ---------- pokretanje testova ---------- */
/* Odgovori kod zaokruživanja mešaju se pri svakom pokušaju */
function prep(q){if(q.t!=='mc')return{...q};const ix=shuffle(q.o.map((_,i)=>i));return{...q,o:ix.map(i=>q.o[i]),a:ix.indexOf(q.a)}}
/* Izvlači po n pitanja svake vrste, ravnomerno iz lekcija (svih ili jedne) */
function draw(n,lesson){
  const all=lesson?POOL.filter(q=>q.src===lesson):POOL,ls=[...new Set(all.map(q=>q.src))];
  return['mc','fill','tf'].flatMap(t=>{const pools=shuffle(ls).map(l=>shuffle(all.filter(q=>q.t===t&&q.src===l))),out=[];
    for(let r=0;out.length<n&&pools.some(p=>p.length);r++){const p=pools[r%pools.length];if(p.length)out.push(p.pop())}
    return shuffle(out)});
}
function begin(id,title,qs,opts){
  qs=qs.map(prep);
  S={id,title,qs,ans:qs.map(q=>q.t==='fill'?q.a.map(()=>''):null),flag:qs.map(()=>false),idx:0,start:Date.now(),keep:!!opts.keep,limit:opts.limit||0};
  view='quiz';confirmEnd=false;render();scrollTo(0,0);
}
const dynamic=id=>id==='ispit'||id==='mix'||id==='greske'||id.startsWith('lekcija-');
function startTest(id){
  if(id==='ispit')return begin(id,'Simulacija ispita',draw(10),{keep:true,limit:30});
  if(id==='mix')return begin(id,'Brzi miks',draw(5),{keep:true});
  if(id==='greske'){const w=loadWrong();return begin(id,'Moje greške',shuffle(POOL.filter(q=>w[q.q])).slice(0,30),{})}
  if(id.startsWith('lekcija-')){const l=LESSONS[+id.slice(8)];return begin(id,'Ispit iz lekcije · '+l,draw(7,l),{keep:true,limit:20})}
  const t=TESTS.find(t=>t.id===id);begin(t.id,t.title+' · '+t.lesson,t.qs.map(q=>({...q,src:t.lesson})),{keep:true});
}
function finish(timeout){
  const res=S.qs.map((q,i)=>grade(q,S.ans[i]));
  const pts=res.reduce((s,r)=>s+r.pts,0),time=S.limit?Math.min(Date.now()-S.start,S.limit*60000):Date.now()-S.start;
  R={...S,res,pts,max:S.qs.length,time,timeout:!!timeout};
  const w=loadWrong();S.qs.forEach((q,i)=>{if(res[i].pts<1)w[q.q]=Date.now();else delete w[q.q]});saveWrong(w);
  if(S.keep)save(S.id,{pts,max:R.max,time,date:Date.now()});
  view='result';onlyWrong=false;copied=null;S=null;render();scrollTo(0,0);
}

/* ---------- prikazi ---------- */
const best=a=>a.reduce((m,x)=>x.pts/x.max>m.pts/m.max?x:m);
function home(){
  const h=load(),wn=Object.keys(loadWrong()).length,recs=Object.values(h).flat();
  const avg=recs.length?Math.round(recs.reduce((s,r)=>s+r.pts/r.max,0)/recs.length*100):null;
  const chip=id=>{const a=h[id];if(!a||!a.length)return'<span class="chip">nije rađen</span>';
    const b=best(a),p=Math.round(b.pts/b.max*100);
    return`<span class="chip ${p>=81?'good':p>=PASS?'warn':'bad'}">najbolje ${fmt(b.pts)}/${b.max} · ${a.length}×</span>`};
  const rowT=(id,title,meta,label)=>`<div class="test"><div class="grow"><h3>${esc(title)}</h3><p class="meta">${meta}</p></div>${chip(id)}<button class="btn ${label?'':'primary'}" data-act="start" data-id="${id}">${label||'Počni'}</button></div>`;
  const lessons=LESSONS.map((l,i)=>{const ts=TESTS.filter(t=>t.lesson===l),n=ts.reduce((s,t)=>s+t.qs.length,0);
    const passed=ts.filter(t=>h[t.id]&&Math.round(best(h[t.id]).pts/best(h[t.id]).max*100)>=PASS).length;
    return`<details class="sheet" data-l="${i}" ${openL.has(i)?'open':''}><summary><span class="num">${String(i+1).padStart(2,'0')}</span>
      <span class="grow stack" style="gap:4px"><h2>${esc(l)}</h2><span class="muted small">${esc(ts[0].author||'')}${NOTE[l]?' · '+esc(NOTE[l]):''} · ${ts.length} testova · ${n} pitanja</span>
      <span class="row" style="gap:8px"><span class="bar grow"><i style="width:${passed/ts.length*100}%"></i></span><span class="mono small muted">${passed}/${ts.length} položeno</span></span></span>
      <span class="caret" aria-hidden="true">▸</span></summary>
      <div class="inner tests">${ts.map(t=>rowT(t.id,t.title,t.qs.length+' pitanja · '+t.qs.length+' poena')).join('')}
      ${rowT('lekcija-'+i,'Ispit iz ove lekcije','21 pitanje iz svih testova lekcije · 20 minuta','Počni ispit')}</div></details>`}).join('');
  return`<header class="stack"><p class="eyebrow"><a class="link" href="../">← Svi predmeti</a> · Priprema za ispit</p><h1>Testovi iz organizacije zdravstva</h1>
    <p class="lead">Pet lekcija sa prezentacija i dve iz video predavanja; kombinovani testovi sa zaokruživanjem, dopunom i tačno/netačno. Kad predaš test, dobijaš poene, ocenu i pregled svakog odgovora.</p></header>
  <div class="stats"><div class="stat"><small>Pitanja u bazi</small><b>${POOL.length}</b></div><div class="stat"><small>Testova</small><b>${TESTS.length}</b></div>
    <div class="stat"><small>Urađeno (24 h)</small><b>${recs.length}</b></div><div class="stat"><small>Prosek (24 h)</small><b>${avg===null?'–':avg+'%'}</b></div></div>
  <section class="sheet"><div class="row"><div class="stack" style="gap:4px;flex:1 1 260px;min-width:0"><p class="eyebrow">Prvo nauči</p><h2>Skripta: suština svih sedam lekcija</h2>
      <p class="muted small">Najbitnije iz svake lekcije i tabela brojki i rokova. Pročitaj lekciju, pa uradi njene testove.</p></div>
      <a class="btn primary" id="skripta" href="${BASE}skripta.pdf" target="_blank" rel="noopener">Otvori skriptu (PDF)</a></div></section>
  <section class="sheet stack"><div><p class="eyebrow">Sve lekcije pomešano</p><h2>Simulacija ispita</h2></div>
    <div class="tests">${rowT('ispit','Simulacija ispita','30 pitanja ravnomerno iz svih lekcija · 30 minuta · predaje se sam kad vreme istekne')}
    ${rowT('mix','Brzi miks','15 pitanja iz svih lekcija, bez ograničenja vremena','Počni')}
    <div class="test"><div class="grow"><h3>Moje greške</h3><p class="meta">${wn?'Pitanja na kojima si pogrešio u poslednja 24 sata; tačan odgovor ih skida sa liste':'Ovde se skupljaju pitanja na kojima pogrešiš'}</p></div>
      <span class="chip ${wn?'bad':''}">${wn} ${wn===1?'pitanje':'pitanja'}</span><button class="btn" id="go-greske" data-act="start" data-id="greske" ${wn?'':'disabled'}>Vežbaj</button></div></div></section>
  <div class="stack"><p class="eyebrow">Lekcije</p>${lessons}</div>
  <details class="sheet help" data-l="help" ${openL.has('help')?'open':''}><summary><span class="grow"><h2>Kako se boduje</h2></span><span class="caret" aria-hidden="true">▸</span></summary>
    <div class="inner"><ul><li>Svako pitanje nosi 1 poen. Kod dopune sa više praznina dobijaš deo poena za svaku tačnu prazninu.</li>
    <li>Dopune se priznaju i bez kvačica, na ćirilici i sa sitnom greškom u kucanju.</li>
    <li>Ocene: ispod 51% je 5, zatim 6 (51–60%), 7 (61–70%), 8 (71–80%), 9 (81–90%) i 10 (91–100%).</li>
    <li>Redosled ponuđenih odgovora menja se pri svakom pokušaju.</li>
    <li>Rezultati i lista grešaka čuvaju se 24 sata samo na ovom uređaju i ne vidi ih niko drugi.</li></ul></div></details>
  <div class="row"><p class="grow muted small">Rezultati se čuvaju 24 sata na ovom uređaju, a zatim se sami brišu.</p>
    <button class="btn" id="reset" data-act="resetAsk" ${recs.length||wn?'':'disabled'}>Obriši rezultate</button></div>
  ${confirmReset?`<div class="veil" data-act="resetCancel"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" data-act="noop">
    <h2 id="mt">Obrisati sve rezultate?</h2><p class="muted">Brišu se najbolji rezultati, broj pokušaja i lista grešaka za sve testove. Ovo ne može da se vrati.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="reset-no" data-act="resetCancel">Odustani</button><button class="btn danger" id="reset-yes" data-act="resetDo">Obriši</button></div></div></div>`:''}`;
}
function body(q,i,a){
  if(q.t==='mc')return`<div class="opts">${q.o.map((o,k)=>`<button class="opt ${a===k?'sel':''}" id="o-${i}-${k}" data-act="pick" data-v="${k}"><b>${'abcd'[k]})</b><span>${esc(o)}</span></button>`).join('')}</div>`;
  if(q.t==='tf')return`<div class="tf">${[true,false].map(v=>`<button class="opt ${a===v?'sel':''}" id="o-${i}-${v}" data-act="pick" data-v="${v}">${v?'Tačno':'Netačno'}</button>`).join('')}</div>`;
  const parts=q.q.split('___');
  return`<p class="q">${parts.map((p,k)=>esc(p)+(k<parts.length-1?`<input class="blank" id="b-${i}-${k}" data-k="${k}" value="${esc(a[k]||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Praznina ${k+1}">`:'')).join('')}</p>`;
}
const remaining=()=>S.limit*60000-(Date.now()-S.start);
function quiz(){
  const i=S.idx,q=S.qs[i],a=S.ans[i],last=i===S.qs.length-1;
  const missing=S.qs.filter((x,k)=>!answered(x,S.ans[k])).length;
  return`<div class="row"><div class="grow"><p class="eyebrow">${esc(S.title)}</p></div>
      <span class="mono clock" id="clock">${S.limit?'preostalo '+clock(remaining()):clock(Date.now()-S.start)}</span><button class="btn quiet" data-act="home">Odustani</button></div>
  <div class="bar"><i style="width:${(i+1)/S.qs.length*100}%"></i></div>
  <section class="sheet stack" style="gap:18px">
    <div class="row"><span class="chip">${TYPE[q.t]}</span>${q.src?`<span class="chip">${esc(q.src)}</span>`:''}<span class="grow"></span><span class="mono muted">${i+1} / ${S.qs.length}</span></div>
    ${q.t==='fill'?'':`<p class="q">${esc(q.q)}</p>`}
    ${body(q,i,a)}
    <div class="row"><button class="btn" data-act="prev" ${i===0?'disabled':''}>Nazad</button>
      <button class="btn ${S.flag[i]?'on':''}" id="flag" data-act="flag" aria-pressed="${S.flag[i]}">${S.flag[i]?'Označeno':'Označi za kasnije'}</button><span class="grow"></span>
      ${last?'<button class="btn primary" data-act="end">Predaj test</button>':'<button class="btn primary" data-act="next">Dalje</button>'}</div>
    ${confirmEnd?`<div class="fb warn"><strong>Ostalo je ${missing} ${missing===1?'pitanje':'pitanja'} bez odgovora.</strong> <span>Neodgovorena pitanja nose 0 poena.</span>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="cancelEnd">Vrati se</button><button class="btn primary" data-act="forceEnd">Predaj svejedno</button></div></div>`:''}
  </section>
  <div class="dots" aria-label="Pitanja">${S.qs.map((x,k)=>`<button class="dot ${answered(x,S.ans[k])?'done':''} ${S.flag[k]?'flag':''} ${k===i?'cur':''}" data-act="go" data-v="${k}" aria-label="Pitanje ${k+1}${S.flag[k]?', označeno':''}">${k+1}</button>`).join('')}</div>
  ${last?'':'<div class="row"><span class="grow"></span><button class="btn quiet" data-act="end">Predaj test</button></div>'}`;
}
const summary=()=>{const p=Math.round(R.pts/R.max*100);return`Testovi iz organizacije zdravstva · ${R.title}: ${fmt(R.pts)}/${R.max} (${p}%), ocena ${mark(p)}, vreme ${clock(R.time)}`};
function result(){
  const p=Math.round(R.pts/R.max*100),m=mark(p),C=2*Math.PI*54,pass=m>5;
  const group=(key,label)=>[...new Set(R.qs.map(key))].map(k=>{const ix=R.qs.map((q,i)=>key(q)===k?i:-1).filter(i=>i>-1);return{name:label(k),n:ix.length,pts:ix.reduce((s,i)=>s+R.res[i].pts,0)}});
  const tile=b=>`<div class="stat"><small>${esc(b.name)}</small><b>${fmt(b.pts)} / ${b.n}</b><div class="bar" style="margin-top:6px"><i style="width:${b.pts/b.n*100}%"></i></div></div>`;
  const byType=group(q=>q.t,k=>SHORT[k]),byLesson=group(q=>q.src||'',k=>k);
  const wrong=R.qs.filter((q,i)=>R.res[i].pts<1).length;
  const rows=R.qs.map((q,i)=>{const g=R.res[i];if(onlyWrong&&g.pts===1)return'';
    const c=g.pts===1?'good':g.pts===0?'bad':'warn';
    return`<div class="rev"><div class="row"><span class="mono muted">${i+1}.</span><span class="chip ${c}">${g.pts===1?'tačno':g.pts===0?'netačno':'delimično'} · ${fmt(g.pts)}</span><span class="chip">${SHORT[q.t]}</span>${byLesson.length>1?`<span class="chip">${esc(q.src)}</span>`:''}</div>
      <p>${esc(q.q.replace(/___/g,'_____'))}</p>
      <p class="ans">Tvoj odgovor: <strong>${esc(givenText(q,R.ans[i]))}</strong></p>
      ${g.pts<1?`<p class="ans">Tačan odgovor: <strong style="color:var(--good)">${esc(correctText(q))}</strong></p>`:''}
      ${q.e&&g.pts<1?`<p class="ans">${esc(q.e)}</p>`:''}</div>`}).join('');
  return`<header class="stack"><p class="eyebrow">Rezultat · ${esc(R.title)}</p><h1>${pass?(m>=9?'Odlično urađeno':'Položeno'):'Još jedan krug ponavljanja'}</h1></header>
  ${R.timeout?'<div class="fb bad"><strong>Vreme je isteklo.</strong> <span>Test je predat sa odgovorima koje si do tada uneo.</span></div>':''}
  <section class="sheet stack" style="gap:18px"><div class="score">
    <svg class="ring" viewBox="0 0 132 132" role="img" aria-label="${p}%"><circle cx="66" cy="66" r="54" fill="none" stroke="var(--line)" stroke-width="12"/>
      <circle cx="66" cy="66" r="54" fill="none" stroke="var(--${pass?'good':'bad'})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 66 66)"/>
      <text x="66" y="74" text-anchor="middle" fill="var(--ink)" font-family="var(--mono)" font-size="24">${p}%</text></svg>
    <div class="stack grow" style="gap:4px"><span class="big">${fmt(R.pts)} <span class="muted" style="font-size:1.4rem">/ ${R.max}</span></span>
      <span>Ocena <strong>${m}</strong> ${pass?'':'(potrebno 51% za prolaz)'}</span><span class="muted">Vreme ${clock(R.time)} · ${R.max-wrong} tačnih, ${wrong} sa greškom</span></div></div>
    <div class="stack"><p class="eyebrow">Po vrsti pitanja</p><div class="stats">${byType.map(tile).join('')}</div></div>
    ${byLesson.length>1?`<div class="stack"><p class="eyebrow">Po lekciji</p><div class="stats">${byLesson.map(tile).join('')}</div></div>`:''}
    <div class="dots">${R.res.map((g,k)=>`<span class="dot ${g.pts===1?'ok':g.pts===0?'no':'half'}">${k+1}</span>`).join('')}</div>
    <div class="row"><button class="btn primary" data-act="again">Ponovi test</button>${wrong?`<button class="btn" data-act="wrongOnly">Vežbaj samo greške (${wrong})</button>`:''}
      <button class="btn" id="copy" data-act="copy">${copied===true?'Kopirano':'Kopiraj rezultat'}</button><button class="btn quiet" data-act="home">Svi testovi</button></div>
    ${copied===false?`<p class="copybox">${esc(summary())}</p>`:''}
  </section>
  <section class="sheet"><div class="row" style="margin-bottom:6px"><h2 class="grow">Pregled odgovora</h2>
    ${wrong?`<div class="seg"><button data-act="filter" data-v="0" aria-pressed="${!onlyWrong}">Sve</button><button data-act="filter" data-v="1" aria-pressed="${onlyWrong}">Samo greške</button></div>`:''}</div>${rows}</section>`;
}
function render(){
  clearInterval(tick);
  app.innerHTML=view==='home'?home():view==='quiz'?quiz():result();
  if(view==='quiz'){tick=setInterval(()=>{if(!S)return;const c=document.getElementById('clock');
      if(S.limit){const r=remaining();if(r<=0)return finish(true);if(c){c.textContent='preostalo '+clock(r);c.classList.toggle('low',r<5*60000)}}
      else if(c)c.textContent=clock(Date.now()-S.start)},1000);
    const b=app.querySelector('.blank');if(b&&!b.value)b.focus({preventScroll:true})}
}
function step(d){S.idx=Math.max(0,Math.min(S.qs.length-1,S.idx+d));confirmEnd=false;render()}

app.addEventListener('toggle',e=>{const d=e.target,l=d.dataset&&d.dataset.l;if(l===undefined)return;const k=l==='help'?l:+l;d.open?openL.add(k):openL.delete(k)},true);
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,v=b.dataset.v;
  if(act==='noop')return;
  if(act==='resetAsk'){confirmReset=true;render();const n=document.getElementById('reset-no');if(n)n.focus()}
  else if(act==='resetCancel'){confirmReset=false;render()}
  else if(act==='resetDo'){wipe();confirmReset=false;render()}
  else if(act==='start')startTest(b.dataset.id);
  else if(act==='home'){view='home';S=null;R=null;render();scrollTo(0,0)}
  else if(act==='pick'){const q=S.qs[S.idx];S.ans[S.idx]=q.t==='mc'?+v:v==='true';render()}
  else if(act==='flag'){S.flag[S.idx]=!S.flag[S.idx];render()}
  else if(act==='next')step(1);else if(act==='prev')step(-1);
  else if(act==='go'){S.idx=+v;confirmEnd=false;render()}
  else if(act==='end'){if(S.qs.some((q,k)=>!answered(q,S.ans[k]))){confirmEnd=true;render()}else finish()}
  else if(act==='cancelEnd'){confirmEnd=false;render()}
  else if(act==='forceEnd')finish();
  else if(act==='filter'){onlyWrong=v==='1';render()}
  else if(act==='again'){const r=R;if(dynamic(r.id))startTest(r.id);else begin(r.id,r.title,r.qs,{keep:r.keep,limit:r.limit})}
  else if(act==='wrongOnly'){const r=R;begin(r.id+'~greske',r.title+' · samo greške',r.qs.filter((q,i)=>r.res[i].pts<1),{})}
  else if(act==='copy'){const done=ok=>{copied=ok;if(view==='result')render()};
    try{navigator.clipboard.writeText(summary()).then(()=>done(true),()=>done(false))}catch(err){done(false)}}
});
app.addEventListener('input',e=>{
  if(!e.target.classList.contains('blank')||!S)return;
  S.ans[S.idx][+e.target.dataset.k]=e.target.value;
  const d=app.querySelectorAll('.dot')[S.idx];if(d)d.classList.toggle('done',answered(S.qs[S.idx],S.ans[S.idx]));
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&confirmReset){confirmReset=false;render();return}
  if(view!=='quiz'||!S)return;const inField=e.target.tagName==='INPUT',q=S.qs[S.idx];
  if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();
    if(inField){const all=[...app.querySelectorAll('.blank')],n=all[all.indexOf(e.target)+1];if(n){n.focus();return}}
    if(S.idx<S.qs.length-1)step(1);return}
  if(inField)return;const k=e.key.toLowerCase();
  if(q.t==='mc'&&k.length===1&&'abcd1234'.includes(k)){const n='abcd1234'.indexOf(k)%4;if(n<q.o.length){S.ans[S.idx]=n;render()}}
  else if(q.t==='tf'&&(k==='t'||k==='n')){S.ans[S.idx]=k==='t';render()}
  else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);
});

function boot(d){if(d&&d.view){view=d.view;S=d.S||null;R=d.R||null;if((view==='quiz'&&!S)||(view==='result'&&!R))view='home'}render()}
try{window.claude?.hot?.snapshot?.(()=>({view,S,R}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
try{const h=location.hash.slice(1);if(h==='ispit'||h==='mix'){history.replaceState(null,'',location.pathname+location.search);startTest(h)}}catch(e){}
</script>
</body>
</html>
